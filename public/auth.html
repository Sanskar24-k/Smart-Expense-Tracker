<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* ===== CSS RESET & BASE ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Colors - Soft Dark Mode */
            --background: #0f0f1a;
            --foreground: #f0f0f5;
            --card: #16161f;
            --card-foreground: #f0f0f5;
            --primary: #10b981;
            --primary-foreground: #0f0f1a;
            --secondary: #1e1e2d;
            --secondary-foreground: #d1d1d9;
            --muted: #1a1a26;
            --muted-foreground: #8b8b9a;
            --border: #2a2a3d;
            --input: #1a1a26;
            --ring: #10b981;
            --destructive: #ef4444;

            /* Radius */
            --radius: 0.75rem;
            --radius-lg: 1rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), #059669);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-foreground);
            margin: 0 auto 1rem;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .auth-header p {
            color: var(--muted-foreground);
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-foreground);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            font-size: 0.875rem;
            color: var(--foreground);
            background-color: var(--input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--ring);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: var(--primary-foreground);
            font-weight: 600;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: filter 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            filter: brightness(0.9);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--muted-foreground);
        }

        .toggle-auth span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
        }

        .toggle-auth span:hover {
            text-decoration: underline;
        }

        .auth-section {
            display: none;
        }

        .auth-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        #error-msg {
            color: var(--destructive);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1rem;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-header">
            <div class="logo-icon">
                <i data-lucide="wallet" style="width: 24px; height: 24px;"></i>
            </div>
            <h1>Smart Expense Tracker</h1>
            <p>Please log in or sign up to continue</p>
        </div>

        <div class="card">
            <div id="error-msg"></div>

            <!-- LOGIN -->
            <section id="login-section" class="auth-section active">
                <form id="login-form">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i data-lucide="mail" style="width: 18px; height: 18px;"></i></span>
                            <input type="email" id="login-email" class="form-input" placeholder="john@example.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i data-lucide="lock" style="width: 18px; height: 18px;"></i></span>
                            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">
                        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Log In
                    </button>
                </form>
                <div class="toggle-auth">
                    Don't have an account? <span onclick="toggleAuth('signup')">Sign Up</span>
                </div>
            </section>

            <!-- SIGNUP -->
            <section id="signup-section" class="auth-section">
                <form id="signup-form">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i data-lucide="user" style="width: 18px; height: 18px;"></i></span>
                            <input type="text" id="signup-name" class="form-input" placeholder="John Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i data-lucide="mail" style="width: 18px; height: 18px;"></i></span>
                            <input type="email" id="signup-email" class="form-input" placeholder="john@example.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i data-lucide="lock" style="width: 18px; height: 18px;"></i></span>
                            <input type="password" id="signup-password" class="form-input" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">
                        <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i> Sign Up
                    </button>
                </form>
                <div class="toggle-auth">
                    Already have an account? <span onclick="toggleAuth('login')">Log In</span>
                </div>
            </section>
        </div>
    </div>

    <script>
        lucide.createIcons();

        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }

        const errorMsg = document.getElementById('error-msg');
        
        const toggleAuth = (type) => {
            document.getElementById('login-section').classList.remove('active');
            document.getElementById('signup-section').classList.remove('active');
            document.getElementById(`${type}-section`).classList.add('active');
            errorMsg.style.display = 'none';
        };

        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const API_URL = 'http://localhost:3000/api/auth';

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userName', data.user.name);
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (err) {
                console.error(err);
                showError("Network error logging in");
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                const res = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Account created! Please log in.');
                    toggleAuth('login');
                } else {
                    showError(data.error || 'Signup failed');
                }
            } catch (err) {
                console.error(err);
                showError("Network error signing up");
            }
        });
    </script>
</body>
</html>
